<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mental Health Chatbot</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #F0F4FF;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 720px;
      height: 92vh;
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(30,58,107,0.12);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header */
    .header {
      background: #1A3A6B;
      color: white;
      padding: 18px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header-icon { font-size: 28px; }
    .header-title { font-size: 20px; font-weight: 700; }
    .header-sub { font-size: 12px; opacity: 0.7; margin-top: 2px; }
    .status-dot {
      width: 10px; height: 10px;
      background: #4ADE80;
      border-radius: 50%;
      margin-left: auto;
      box-shadow: 0 0 6px #4ADE80;
    }

    /* Chat area */
    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      background: #F8FAFF;
    }

    /* Welcome message */
    .welcome {
      text-align: center;
      padding: 32px 20px;
      color: #64748B;
    }
    .welcome h2 { color: #1A3A6B; margin-bottom: 8px; font-size: 22px; }
    .welcome p { font-size: 14px; line-height: 1.6; }

    /* Messages */
    .message { display: flex; flex-direction: column; max-width: 85%; }
    .message.user { align-self: flex-end; align-items: flex-end; }
    .message.bot  { align-self: flex-start; align-items: flex-start; }

    .bubble {
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.5;
      max-width: 100%;
      word-break: break-word;
    }
    .message.user .bubble {
      background: #1A3A6B;
      color: white;
      border-bottom-right-radius: 4px;
    }
    .message.bot .bubble {
      background: white;
      color: #1E293B;
      border: 1px solid #E2E8F0;
      border-bottom-left-radius: 4px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    /* Analysis cards */
    .analysis-card {
      background: white;
      border: 1px solid #E2E8F0;
      border-radius: 12px;
      padding: 14px 16px;
      margin-top: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      width: 100%;
      max-width: 420px;
    }

    .metrics-row {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }
    .metric {
      flex: 1;
      background: #F0F4FF;
      border-radius: 8px;
      padding: 8px 10px;
      text-align: center;
    }
    .metric-value {
      font-size: 18px;
      font-weight: 700;
      color: #1A3A6B;
    }
    .metric-label {
      font-size: 10px;
      color: #64748B;
      margin-top: 2px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Stress bar */
    .stress-bar-wrap {
      margin-bottom: 12px;
    }
    .stress-bar-label {
      font-size: 11px;
      color: #64748B;
      margin-bottom: 4px;
      display: flex;
      justify-content: space-between;
    }
    .stress-bar-bg {
      height: 8px;
      background: #E2E8F0;
      border-radius: 99px;
      overflow: hidden;
    }
    .stress-bar-fill {
      height: 100%;
      border-radius: 99px;
      transition: width 0.6s ease;
    }

    /* Game recommendation */
    .game-rec {
      background: linear-gradient(135deg, #EBF5FF, #F0FFF4);
      border: 1px solid #93C5FD;
      border-radius: 10px;
      padding: 10px 13px;
      display: flex;
      align-items: flex-start;
      gap: 10px;
    }
    .game-icon { font-size: 22px; flex-shrink: 0; }
    .game-name { font-weight: 600; color: #1A3A6B; font-size: 13px; }
    .game-desc { font-size: 12px; color: #64748B; margin-top: 2px; }

    .calm-msg {
      background: #F0FDF4;
      border: 1px solid #86EFAC;
      border-radius: 10px;
      padding: 10px 13px;
      font-size: 13px;
      color: #166534;
    }

    /* Typing indicator */
    .typing {
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 12px 16px;
      background: white;
      border: 1px solid #E2E8F0;
      border-radius: 16px;
      border-bottom-left-radius: 4px;
      width: fit-content;
    }
    .typing span {
      width: 7px; height: 7px;
      background: #94A3B8;
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-6px); }
    }

    /* Input area */
    .input-area {
      padding: 16px 20px;
      background: white;
      border-top: 1px solid #E2E8F0;
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    textarea {
      flex: 1;
      border: 1.5px solid #CBD5E1;
      border-radius: 12px;
      padding: 10px 14px;
      font-size: 14px;
      font-family: inherit;
      resize: none;
      outline: none;
      max-height: 120px;
      min-height: 42px;
      line-height: 1.5;
      color: #1E293B;
      transition: border-color 0.2s;
    }
    textarea:focus { border-color: #1A3A6B; }
    textarea::placeholder { color: #94A3B8; }

    button#sendBtn {
      background: #1A3A6B;
      color: white;
      border: none;
      border-radius: 12px;
      width: 44px;
      height: 44px;
      font-size: 18px;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.2s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    button#sendBtn:hover { background: #2E5FAB; }
    button#sendBtn:active { transform: scale(0.95); }
    button#sendBtn:disabled { background: #CBD5E1; cursor: not-allowed; }

    /* Scrollbar */
    .chat-area::-webkit-scrollbar { width: 4px; }
    .chat-area::-webkit-scrollbar-track { background: transparent; }
    .chat-area::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 2px; }
  </style>
</head>
<body>
<div class="container">

  <!-- Header -->
  <div class="header">
    <div class="header-icon">🧠</div>
    <div>
      <div class="header-title">Mental Health Chatbot</div>
      <div class="header-sub">Stress Detection · Emotion Classification · Game Recommendation</div>
    </div>
    <div class="status-dot" title="Models loaded"></div>
  </div>

  <!-- Chat area -->
  <div class="chat-area" id="chatArea">
    <div class="welcome">
      <h2>Hello! How are you feeling today?</h2>
      <p>Tell me what's on your mind.<br>
      I'll detect your stress level and emotional state,<br>
      and suggest a therapeutic activity if needed.</p>
    </div>
  </div>

  <!-- Input -->
  <div class="input-area">
    <textarea
      id="inputText"
      placeholder="Type how you feel..."
      rows="1"
      onkeydown="handleKey(event)"
      oninput="autoResize(this)"
    ></textarea>
    <button id="sendBtn" onclick="sendMessage()">➤</button>
  </div>

</div>

<script>
const FLASK_URL = "http://127.0.0.1:5000";

const GAME_ICONS = {
  breathing_game:    "🌬️",
  color_tap:         "🎨",
  body_scan:         "🧘",
  nature_walk:       "🌿",
  memory_match:      "🃏",
  gratitude_journal: "📔",
  puzzle:            "🧩",
  word_search:       "🔤",
  trivia:            "💡",
  bubble_pop:        "🫧",
  doodle_draw:       "✏️",
  countdown_timer:   "⏱️",
  music_therapy:     "🎵",
  micro_journal:     "📝",
  positive_memory:   "💭",
};

function getStressColor(level) {
  if (level > 0.8) return "#EF4444";
  if (level > 0.6) return "#F59E0B";
  return "#22C55E";
}

function getStressLabel(level) {
  if (level > 0.8) return "🔴 High";
  if (level > 0.6) return "🟡 Moderate";
  return "🟢 Low";
}

function autoResize(el) {
  el.style.height = "auto";
  el.style.height = Math.min(el.scrollHeight, 120) + "px";
}

function handleKey(e) {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

function appendMessage(role, content) {
  const area = document.getElementById("chatArea");
  const div = document.createElement("div");
  div.className = `message ${role}`;
  div.innerHTML = `<div class="bubble">${content}</div>`;
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
  return div;
}

function appendAnalysis(data) {
  const area   = document.getElementById("chatArea");
  const result = data.analysis;
  const stress = result.stress_level;
  const pct    = Math.round(stress * 100);
  const emotion = result.emotion;
  const conf    = Math.round(result.emotion_confidence * 100);
  const color   = getStressColor(stress);
  const label   = getStressLabel(stress);

  let gameHTML = "";
  if (data.needs_intervention && data.intervention) {
    const g    = data.intervention.game;
    const icon = GAME_ICONS[g] || "🎮";
    const name = g.replace(/_/g, " ").replace(/\b\w/g, c => c.toUpperCase());
    const desc = data.intervention.description;
    gameHTML = `
      <div class="game-rec">
        <div class="game-icon">${icon}</div>
        <div>
          <div class="game-name">Recommended: ${name}</div>
          <div class="game-desc">${desc}</div>
        </div>
      </div>`;
  } else {
    gameHTML = `<div class="calm-msg">😊 You seem calm — no intervention needed right now.</div>`;
  }

  const card = document.createElement("div");
  card.className = "message bot";
  card.innerHTML = `
    <div class="analysis-card">
      <div class="metrics-row">
        <div class="metric">
          <div class="metric-value" style="color:${color}">${pct}%</div>
          <div class="metric-label">Stress</div>
        </div>
        <div class="metric">
          <div class="metric-value">${emotion}</div>
          <div class="metric-label">Emotion</div>
        </div>
        <div class="metric">
          <div class="metric-value">${conf}%</div>
          <div class="metric-label">Confidence</div>
        </div>
      </div>
      <div class="stress-bar-wrap">
        <div class="stress-bar-label">
          <span>Stress level</span>
          <span>${label}</span>
        </div>
        <div class="stress-bar-bg">
          <div class="stress-bar-fill"
            style="width:${pct}%; background:${color}">
          </div>
        </div>
      </div>
      ${gameHTML}
    </div>`;

  area.appendChild(card);
  area.scrollTop = area.scrollHeight;
}

function showTyping() {
  const area = document.getElementById("chatArea");
  const div  = document.createElement("div");
  div.className = "message bot";
  div.id = "typing";
  div.innerHTML = `
    <div class="typing">
      <span></span><span></span><span></span>
    </div>`;
  area.appendChild(div);
  area.scrollTop = area.scrollHeight;
}

function removeTyping() {
  const el = document.getElementById("typing");
  if (el) el.remove();
}

async function sendMessage() {
  const input = document.getElementById("inputText");
  const btn   = document.getElementById("sendBtn");
  const text  = input.value.trim();

  if (!text || text.length < 5) return;

  // Clear welcome
  const welcome = document.querySelector(".welcome");
  if (welcome) welcome.remove();

  // Show user message
  appendMessage("user", text);
  input.value = "";
  input.style.height = "auto";
  btn.disabled = true;
  showTyping();

  try {
    const res  = await fetch(`${FLASK_URL}/api/chat`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message: text })
    });
    const data = await res.json();
    removeTyping();

    if (data.status === "success") {
      // Supportive text message
      appendMessage("bot", data.supportive_message);
      // Analysis card
      appendAnalysis(data);
    } else {
      appendMessage("bot", `⚠️ Error: ${data.error || "Unknown error"}`);
    }
  } catch (err) {
    removeTyping();
    appendMessage("bot", "⚠️ Cannot connect to server. Make sure Flask is running on port 5000.");
  }

  btn.disabled = false;
  input.focus();
}
</script>
</body>
</html>
